services:
  mariadb:
    restart: unless-stopped

  php:
    image: wodby/laravel-php:$PHP_TAG_PROD
    restart: unless-stopped
    environment:
      # laravel .env variables
      APP_ENV: production
      APP_DEBUG: "false"
      LARAVEL_APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: $DB_NAME
      DB_USERNAME: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      # wodby
      PHP_EXTENSIONS_DISABLE: xhprof,spx,xdebug

  nginx:
    restart: unless-stopped
    environment:
      NGINX_STATIC_OPEN_FILE_CACHE: "on"
      NGINX_ERROR_LOG_LEVEL: warn

  caddy:
    image: caddy:${CADDY_TAG}
    container_name: "${PROJECT_NAME}_caddy"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./docker-init/data/caddy:/data
      - ./docker-init/config/caddy:/config
    environment:
      - EMAIL=${EMAIL}
      - PROJECT_BASE_URL=${PROJECT_BASE_URL}
    networks:
      - default
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  crond:
    image: wodby/laravel-php:$PHP_TAG_PROD
    container_name: "${PROJECT_NAME}_crond"
    environment:
      # laravel .env variables
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      LARAVEL_APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: $DB_NAME
      DB_USERNAME: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      # wodby
      PHP_EXTENSIONS_DISABLE: xhprof,spx,xdebug
      CRONTAB: |
        * * * * * php /var/www/html/laravel/artisan schedule:run >> /var/log/cron.log 2>&1
        */5 * * * * php /var/www/html/laravel/artisan queue:work database --tries=1 --max-time=30 --stop-when-empty >> /var/log/cron.log 2>&1
    command: sudo -E crond -f -d 0
    volumes:
      - ./:/var/www/html:cached
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      php:
        condition: service_started
