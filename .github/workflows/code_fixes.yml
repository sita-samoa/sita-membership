name: Code Fixes

on:
  push:

permissions:
  contents: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Setup Composer
        uses: "ramsey/composer-install@v2"
        with:
          working-directory: ./laravel
      - name: Fix PHP code style issues
        run: composer format_ci
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format code
        run: npm run format
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[ci-review] Fix styling"
